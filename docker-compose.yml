version: '3.6'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-backend
    hostname: backend-host
    volumes: 
      - ./backend:/app1
    ports:
      - "8000:8000"
    networks:
      - ares-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-frontend
    hostname: frontend-host
    volumes:
      - ./frontend:/app2
    environment:
      - BACKEND_URL=http://backend-host:8000/api
    ports:
      - "3000:3000"
    links:
      - backend
    depends_on:
      - backend
    networks:
      - ares-network

networks:
  ares-network: {}